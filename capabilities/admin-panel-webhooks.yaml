      name: admin-webhooks
      description: REST surface for admin-webhooks.
      operations:
      - method: GET
        name: listwebhooks
        description: List webhooks
        call: admin-panel-webhooks.listwebhooks
        outputParameters:
        - type: object
          mapping: $.
