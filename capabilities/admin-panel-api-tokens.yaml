    resources:
    - name: admin-api-tokens
      path: /admin/api-tokens
      operations:
      - name: listapitokens
        method: GET
        description: List API tokens
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createapitoken
        method: POST
        description: Create an API token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
