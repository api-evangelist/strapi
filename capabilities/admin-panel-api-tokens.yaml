    resources:
    - path: /v1/admin/api-tokens
      name: admin-api-tokens
      description: REST surface for admin-api-tokens.
      operations:
      - method: GET
        name: listapitokens
        description: List API tokens
        call: admin-panel-api-tokens.listapitokens
        outputParameters:
        - type: object
          mapping: $.
