naftiko: 1.0.0-alpha2
info:
  label: Strapi Users and Permissions API — Permissions
  description: 'Strapi Users and Permissions API — Permissions. 1 operations. Lead operation: List permissions. Self-contained
    Naftiko capability covering one Strapi business surface.'
  tags:
  - Strapi
  - Permissions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    STRAPI_API_KEY: STRAPI_API_KEY
capability:
  consumes:
  - type: http
    namespace: users-and-permissions-permissions
    baseUri: https://{host}
    description: Strapi Users and Permissions API — Permissions business capability. Self-contained, no shared references.
    resources:
    - name: api-users-permissions-permissions
      path: /api/users-permissions/permissions
      operations:
      - name: listpermissions
        method: GET
        description: List permissions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
