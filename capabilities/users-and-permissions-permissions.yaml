      name: api-users-permissions-permissions
      description: REST surface for api-users-permissions-permissions.
      operations:
      - method: GET
        name: listpermissions
        description: List permissions
        call: users-and-permissions-permissions.listpermissions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
