naftiko: 1.0.0-alpha2
info:
  label: Strapi Admin Panel API — Content Types
  description: 'Strapi Admin Panel API — Content Types. 2 operations. Lead operation: List content types. Self-contained Naftiko
    capability covering one Strapi business surface.'
  tags:
  - Strapi
  - Content Types
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    STRAPI_API_KEY: STRAPI_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-panel-content-types
    baseUri: https://{host}
    description: Strapi Admin Panel API — Content Types business capability. Self-contained, no shared references.
    resources:
    - name: admin-content-type-builder-content-types
      path: /admin/content-type-builder/content-types
      operations:
      - name: listcontenttypes
        method: GET
        description: List content types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: admin-content-type-builder-content-types-uid
      path: /admin/content-type-builder/content-types/{uid}
      operations:
      - name: getcontenttype
        method: GET
        description: Get a content type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: uid
          in: path
          type: string
          description: The unique identifier of the content-type (e.g., api::article.article)
          required: true
    authentication:
      type: bearer
      token: '{{env.STRAPI_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-panel-content-types-rest
    port: 8080
    description: REST adapter for Strapi Admin Panel API — Content Types. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/admin/content-type-builder/content-types
      name: admin-content-type-builder-content-types
      description: REST surface for admin-content-type-builder-content-types.
      operations:
      - method: GET
        name: listcontenttypes
        description: List content types
        call: admin-panel-content-types.listcontenttypes
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/admin/content-type-builder/content-types/{uid}
      name: admin-content-type-builder-content-types-uid
      description: REST surface for admin-content-type-builder-content-types-uid.
      operations:
      - method: GET
        name: getcontenttype
        description: Get a content type
        call: admin-panel-content-types.getcontenttype
        with:
          uid: rest.uid
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-panel-content-types-mcp
    port: 9090
    transport: http
    description: MCP adapter for Strapi Admin Panel API — Content Types. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-content-types
      description: List content types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-panel-content-types.listcontenttypes
      outputParameters:
      - type: object
        mapping: $.
    - name: get-content-type
      description: Get a content type
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-panel-content-types.getcontenttype
      with:
        uid: tools.uid
      outputParameters:
      - type: object
        mapping: $.
