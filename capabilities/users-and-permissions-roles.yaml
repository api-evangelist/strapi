naftiko: 1.0.0-alpha2
info:
  label: Strapi Users and Permissions API — Roles
  description: 'Strapi Users and Permissions API — Roles. 2 operations. Lead operation: List roles. Self-contained Naftiko
    capability covering one Strapi business surface.'
  tags:
  - Strapi
  - Roles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    STRAPI_API_KEY: STRAPI_API_KEY
capability:
  consumes:
  - type: http
    namespace: users-and-permissions-roles
    baseUri: https://{host}
    description: Strapi Users and Permissions API — Roles business capability. Self-contained, no shared references.
    resources:
    - name: api-users-permissions-roles
      path: /api/users-permissions/roles
      operations:
      - name: listroles
        method: GET
        description: List roles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-users-permissions-roles-id
      path: /api/users-permissions/roles/{id}
      operations:
      - name: getrole
        method: GET
        description: Get a role
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The ID of the role
          required: true
    authentication:
      type: bearer
      token: '{{env.STRAPI_API_KEY}}'
  exposes:
  - type: rest
    namespace: users-and-permissions-roles-rest
    port: 8080
    description: REST adapter for Strapi Users and Permissions API — Roles. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/users-permissions/roles
      name: api-users-permissions-roles
      description: REST surface for api-users-permissions-roles.
      operations:
      - method: GET
        name: listroles
        description: List roles
        call: users-and-permissions-roles.listroles
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/users-permissions/roles/{id}
      name: api-users-permissions-roles-id
      description: REST surface for api-users-permissions-roles-id.
      operations:
      - method: GET
        name: getrole
        description: Get a role
        call: users-and-permissions-roles.getrole
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: users-and-permissions-roles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Strapi Users and Permissions API — Roles. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-roles
      description: List roles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: users-and-permissions-roles.listroles
      outputParameters:
      - type: object
        mapping: $.
    - name: get-role
      description: Get a role
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: users-and-permissions-roles.getrole
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
