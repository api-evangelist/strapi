        destructive: false
        idempotent: false
      call: rest-content-entries.createentry
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-content-entry
      description: Get a content entry
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-content-entries.findoneentry
      outputParameters:
      - type: object
        mapping: $.
    - name: update-content-entry
      description: Update a content entry
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rest-content-entries.updateentry
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-content-entry
      description: Delete a content entry
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: rest-content-entries.deleteentry
      outputParameters:
      - type: object
        mapping: $.
    - name: publish-content-entry
      description: Publish a content entry
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-content-entries.publishentry
      outputParameters:
      - type: object
        mapping: $.
    - name: unpublish-content-entry
      description: Unpublish a content entry
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-content-entries.unpublishentry
      outputParameters:
      - type: object
        mapping: $.
