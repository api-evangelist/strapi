naftiko: "1.0.0-alpha1"

info:
  label: "Strapi REST API"
  description: >-
    Strapi REST API for accessing and managing content-type entries. Provides
    full CRUD operations with filtering, sorting, pagination, and population
    of relational fields. Also includes the Upload plugin for media library
    management.
  tags:
    - CMS
    - Content Management
    - Headless CMS
    - REST API
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      STRAPI_JWT_TOKEN: STRAPI_JWT_TOKEN

capability:
  consumes:
    - type: http
      namespace: strapi-rest
      baseUri: https://{host}
      description: "Strapi REST API for content management"
      authentication:
        type: bearer
        token: "{{STRAPI_JWT_TOKEN}}"
      resources:
        - name: content-entries
          path: /api/{pluralApiId}
          description: "CRUD operations on content-type entries"
          operations:
            - name: find-entries
              method: GET
              description: "List content entries with filtering, sorting, and pagination"
              inputParameters:
                - name: pluralApiId
                  in: path
                  type: string
                  required: true
                  description: "The plural API identifier of the content-type"
                - name: sort
                  in: query
                  type: string
                  required: false
                  description: "Sort criteria (e.g., createdAt:desc)"
                - name: pagination[page]
                  in: query
                  type: integer
                  required: false
                  description: "Page number for pagination"
                - name: pagination[pageSize]
                  in: query
                  type: integer
                  required: false
                  description: "Number of results per page"
                - name: populate
                  in: query
                  type: string
                  required: false
                  description: "Fields to populate (* for all)"
                - name: filters
                  in: query
                  type: object
                  required: false
                  description: "Filter criteria using operator syntax"
                - name: locale
                  in: query
                  type: string
                  required: false
                  description: "Locale code for internationalized content"
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Publication status filter (draft or published)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-entry
              method: POST
              description: "Create a new content entry"
              inputParameters:
                - name: pluralApiId
                  in: path
                  type: string
                  required: true
                  description: "The plural API identifier of the content-type"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
        - name: content-entry
          path: /api/{pluralApiId}/{documentId}
          description: "Single content entry operations"
          operations:
            - name: find-one-entry
              method: GET
              description: "Get a single content entry by document ID"
              inputParameters:
                - name: pluralApiId
                  in: path
                  type: string
                  required: true
                  description: "The plural API identifier of the content-type"
                - name: documentId
                  in: path
                  type: string
                  required: true
                  description: "The unique document ID of the entry"
                - name: populate
                  in: query
                  type: string
                  required: false
                  description: "Fields to populate"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-entry
              method: PUT
              description: "Update a content entry by document ID"
              inputParameters:
                - name: pluralApiId
                  in: path
                  type: string
                  required: true
                  description: "The plural API identifier of the content-type"
                - name: documentId
                  in: path
                  type: string
                  required: true
                  description: "The unique document ID of the entry"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
            - name: delete-entry
              method: DELETE
              description: "Delete a content entry by document ID"
              inputParameters:
                - name: pluralApiId
                  in: path
                  type: string
                  required: true
                  description: "The plural API identifier of the content-type"
                - name: documentId
                  in: path
                  type: string
                  required: true
                  description: "The unique document ID of the entry"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: upload-files
          path: /api/upload
          description: "File upload and media library management"
          operations:
            - name: upload-files
              method: POST
              description: "Upload files to the Strapi media library"
              inputParameters:
                - name: ref
                  in: query
                  type: string
                  required: false
                  description: "API identifier of the content-type to link the file to"
                - name: refId
                  in: query
                  type: string
                  required: false
                  description: "Document ID of the entry to link the file to"
                - name: field
                  in: query
                  type: string
                  required: false
                  description: "Field name on the entry where the file should be linked"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: upload-files-list
          path: /api/upload/files
          description: "List files in the media library"
          operations:
            - name: list-upload-files
              method: GET
              description: "Returns a list of all files in the Strapi media library"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: strapi-rest-api
      resources:
        - path: /v1/content/{pluralApiId}
          name: content-entries
          description: "Content entry collection endpoints"
          operations:
            - method: GET
              name: find-entries
              description: "List content entries"
              call: "strapi-rest.find-entries"
              with:
                pluralApiId: "rest.pluralApiId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-entry
              description: "Create a content entry"
              call: "strapi-rest.create-entry"
              with:
                pluralApiId: "rest.pluralApiId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/content/{pluralApiId}/{documentId}
          name: content-entry
          description: "Single content entry endpoints"
          operations:
            - method: GET
              name: find-one-entry
              description: "Get a single content entry"
              call: "strapi-rest.find-one-entry"
              with:
                pluralApiId: "rest.pluralApiId"
                documentId: "rest.documentId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: PUT
              name: update-entry
              description: "Update a content entry"
              call: "strapi-rest.update-entry"
              with:
                pluralApiId: "rest.pluralApiId"
                documentId: "rest.documentId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: DELETE
              name: delete-entry
              description: "Delete a content entry"
              call: "strapi-rest.delete-entry"
              with:
                pluralApiId: "rest.pluralApiId"
                documentId: "rest.documentId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: strapi-rest-mcp
      transport: http
      tools:
        - name: find-entries
          description: "List content entries for a given content-type"
          hints:
            readOnly: true
            openWorld: true
          call: "strapi-rest.find-entries"
          with:
            pluralApiId: "tools.pluralApiId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-entry
          description: "Create a new content entry"
          hints:
            readOnly: false
            destructive: false
          call: "strapi-rest.create-entry"
          with:
            pluralApiId: "tools.pluralApiId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: find-one-entry
          description: "Get a single content entry by document ID"
          hints:
            readOnly: true
            openWorld: false
          call: "strapi-rest.find-one-entry"
          with:
            pluralApiId: "tools.pluralApiId"
            documentId: "tools.documentId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-entry
          description: "Update an existing content entry"
          hints:
            readOnly: false
            idempotent: true
          call: "strapi-rest.update-entry"
          with:
            pluralApiId: "tools.pluralApiId"
            documentId: "tools.documentId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-entry
          description: "Delete a content entry permanently"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "strapi-rest.delete-entry"
          with:
            pluralApiId: "tools.pluralApiId"
            documentId: "tools.documentId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-media-files
          description: "List all files in the Strapi media library"
          hints:
            readOnly: true
            openWorld: true
          call: "strapi-rest.list-upload-files"
          outputParameters:
            - type: object
              mapping: "$."
