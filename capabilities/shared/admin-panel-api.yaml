naftiko: "1.0.0-alpha1"

info:
  label: "Strapi Admin Panel API"
  description: >-
    Strapi Admin Panel API for managing administrator accounts, roles,
    content-types, webhooks, and API tokens. Powers the Strapi back-office
    interface for platform administration.
  tags:
    - Admin
    - CMS
    - Content Management
    - RBAC
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      STRAPI_ADMIN_JWT_TOKEN: STRAPI_ADMIN_JWT_TOKEN

capability:
  consumes:
    - type: http
      namespace: strapi-admin
      baseUri: https://{host}
      description: "Strapi Admin Panel API"
      authentication:
        type: bearer
        token: "{{STRAPI_ADMIN_JWT_TOKEN}}"
      resources:
        - name: admin-users
          path: /admin/users
          description: "Administrator user account management"
          operations:
            - name: list-admin-users
              method: GET
              description: "List all administrator accounts"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: pageSize
                  in: query
                  type: integer
                  required: false
                  description: "Results per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-admin-user
              method: POST
              description: "Create a new administrator account"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  firstname: "{{tools.firstname}}"
                  lastname: "{{tools.lastname}}"
                  email: "{{tools.email}}"
                  roles: "{{tools.roles}}"
        - name: admin-user
          path: /admin/users/{id}
          description: "Single administrator user operations"
          operations:
            - name: get-admin-user
              method: GET
              description: "Get an administrator user by ID"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The administrator user ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-admin-user
              method: PUT
              description: "Update an administrator user"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The administrator user ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  firstname: "{{tools.firstname}}"
                  lastname: "{{tools.lastname}}"
                  isActive: "{{tools.isActive}}"
                  roles: "{{tools.roles}}"
            - name: delete-admin-user
              method: DELETE
              description: "Delete an administrator user"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The administrator user ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: admin-roles
          path: /admin/roles
          description: "Administrator role management"
          operations:
            - name: list-admin-roles
              method: GET
              description: "List all administrator roles"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-admin-role
              method: POST
              description: "Create a custom administrator role"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  description: "{{tools.description}}"
                  permissions: "{{tools.permissions}}"
        - name: api-tokens
          path: /admin/api-tokens
          description: "API token management"
          operations:
            - name: list-api-tokens
              method: GET
              description: "List all API tokens"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-api-token
              method: POST
              description: "Create a new API token"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  type: "{{tools.type}}"
                  lifespan: "{{tools.lifespan}}"
        - name: webhooks
          path: /admin/webhooks
          description: "Webhook configuration management"
          operations:
            - name: list-webhooks
              method: GET
              description: "List all webhook configurations"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-webhook
              method: POST
              description: "Create a new webhook"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  url: "{{tools.url}}"
                  events: "{{tools.events}}"
                  isEnabled: "{{tools.isEnabled}}"

  exposes:
    - type: rest
      port: 8101
      namespace: strapi-admin-api
      resources:
        - path: /v1/admin/users
          name: admin-users
          description: "Administrator user management"
          operations:
            - method: GET
              name: list-admin-users
              description: "List administrator users"
              call: "strapi-admin.list-admin-users"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/admin/api-tokens
          name: api-tokens
          description: "API token management"
          operations:
            - method: GET
              name: list-api-tokens
              description: "List API tokens"
              call: "strapi-admin.list-api-tokens"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: strapi-admin-mcp
      transport: http
      tools:
        - name: list-admin-users
          description: "List all administrator accounts"
          hints:
            readOnly: true
          call: "strapi-admin.list-admin-users"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-admin-user
          description: "Create a new administrator account"
          hints:
            readOnly: false
          call: "strapi-admin.create-admin-user"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-admin-roles
          description: "List all administrator roles"
          hints:
            readOnly: true
          call: "strapi-admin.list-admin-roles"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-api-tokens
          description: "List all API tokens"
          hints:
            readOnly: true
          call: "strapi-admin.list-api-tokens"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-api-token
          description: "Create a new API token"
          hints:
            readOnly: false
          call: "strapi-admin.create-api-token"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-webhooks
          description: "List all webhook configurations"
          hints:
            readOnly: true
          call: "strapi-admin.list-webhooks"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-webhook
          description: "Create a new webhook configuration"
          hints:
            readOnly: false
          call: "strapi-admin.create-webhook"
          outputParameters:
            - type: object
              mapping: "$."
