- aid: strapi:strapi-webhooks
  name: Strapi Webhooks
  description: >-
    Strapi includes a built-in webhook system that notifies external services whenever content entries
    or media assets are created, updated, deleted, published, or unpublished. Webhooks are configured
    through the admin panel and include a custom X-Strapi-Event header identifying the event type.
  humanURL: https://docs.strapi.io/cms/backend-customization/webhooks
  tags:
  - CMS
  - Event
  - Webhook
