aid: strapi
name: Strapi
description: >-
  Strapi is an open-source, headless CMS built with Node.js that gives developers full control over their content API.
  It provides a customizable admin panel for content management, automatically generates REST and GraphQL APIs for every
  content-type, and supports flexible database options including SQLite, PostgreSQL, MySQL, and MongoDB. Strapi v5
  introduces a Document Service API with flattened response format, improved TypeScript support, and an enhanced content
  delivery API for building fast, decoupled frontends.
