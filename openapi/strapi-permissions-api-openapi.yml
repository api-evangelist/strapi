openapi: 3.2.0
info:
  title: Strapi Users Permissions API
  description: The Strapi Users and Permissions API provides a full authentication process based on JSON Web Tokens (JWT) to protect API endpoints, along with an access-control list (ACL) strategy for managing permissions between groups of users.
  version: 5.0.0
  contact:
    name: Strapi Support
    url: https://strapi.io/support
  termsOfService: https://strapi.io/terms
servers:
- url: https://{host}
  description: Strapi Server
  variables:
    host:
      default: localhost:1337
      description: The hostname and port of your Strapi instance
security:
- bearerAuth: []
tags:
- name: Permissions
  description: Endpoints for viewing and configuring permissions assigned to roles.
paths:
  /api/users-permissions/permissions:
    get:
      operationId: listPermissions
      summary: List permissions
      description: Returns the full list of available permissions grouped by plugin and controller. Used to understand which actions can be assigned to roles.
      tags:
      - Permissions
      responses:
        '200':
          description: A list of available permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: object
                    description: Permissions grouped by plugin and controller action
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  schemas:
    Error:
      type: object
      properties:
        data:
          nullable: true
        error:
          type: object
          properties:
            status:
              type: integer
              description: The HTTP status code
            name:
              type: string
              description: The error name
            message:
              type: string
              description: A human-readable error message
            details:
              type: object
              description: Additional error details
  responses:
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT token obtained from the /api/auth/local endpoint. Include as Authorization: Bearer {token}.'
externalDocs:
  description: Strapi Users and Permissions Documentation
  url: https://docs.strapi.io/cms/features/users-permissions
